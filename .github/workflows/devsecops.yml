name: GitHub Actions DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  devsecops:
    name: DevSecOps Pipeline
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Verify Project Files
      - name: Verify Project Structure
        run: |
          echo "Checking project files..."
          ls -la

          test -f pom.xml || {
            echo "ERROR: pom.xml not found"
            exit 1
          }

          test -f Dockerfile || {
            echo "ERROR: Dockerfile not found"
            exit 1
          }

          echo "Project files verified successfully"

      # 3. Gitleaks Secret Scanning
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 5. Maven Build
      - name: Maven Build
        run: mvn --batch-mode clean verify

      # 6. SonarQube Code Analysis
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn --batch-mode \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar \
            -Dsonar.projectKey=github-actions-devsecops \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      # 7. Docker Image Build
      - name: Docker Build
        run: |
          docker build \
            -t devsecops-app:${{ github.sha }} .

      # 8. Trivy Container Vulnerability Scan
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
