name: GitHub Actions DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  devsecops:
    name: DevSecOps Pipeline
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Verify Project Files
      - name: Verify Project Structure
        run: |
          echo "Checking project files..."
          ls -la

          test -f pom.xml || {
            echo "ERROR: pom.xml not found"
            exit 1
          }

          test -f Dockerfile || {
            echo "ERROR: Dockerfile not found"
            exit 1
          }

          echo "Project files verified successfully"

      # 3. Gitleaks Secret Scanning
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 5. Maven Build
      - name: Maven Build
        run: mvn --batch-mode clean verify

      # 6. SonarQube Code Analysis
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn --batch-mode \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar \
            -Dsonar.projectKey=github-actions-devsecops \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      # 7. Docker Image Build
      - name: Docker Build
        run: |
          docker build \
            -t devsecops-app:${{ github.sha }} .

      # 8. Trivy Container Vulnerability Scan
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
    # FINAL STAGE: runs only if every job above succeeded
  build-successful:
    name: Build successful
    runs-on: ubuntu-latest
    needs: [gitleaks, build-sonar, trivy-fs, image-scan]
    steps:
      - name: Build success message
        run: |
          echo "=============================================="
          echo " BUILD SUCCESSFUL"
          echo "=============================================="
          echo " Repository : ${{ github.repository }}"
          echo " Branch     : ${{ github.ref_name }}"
          echo " Commit     : ${{ github.sha }}"
          echo " Triggered  : ${{ github.actor }}"
          echo " Run number : ${{ github.run_number }}"
          echo "=============================================="
          echo " Gitleaks ........ PASSED"
          echo " Maven build ..... PASSED"
          echo " SonarQube ....... PASSED"
          echo " Trivy fs ........ PASSED"
          echo " Trivy image ..... PASSED"
          echo "=============================================="

      - name: Add summary to the run page
        run: |
          {
            echo "## Build Successful"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Gitleaks secret scan | Passed |"
            echo "| Maven build and tests | Passed |"
            echo "| SonarQube quality gate | Passed |"
            echo "| Trivy repo scan | Passed |"
            echo "| Docker and Trivy image scan | Passed |"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "**Branch:** ${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs only if any job failed
  build-failed:
    name: Build failed
    runs-on: ubuntu-latest
    needs: [gitleaks, build-sonar, trivy-fs, image-scan]
    if: failure()
    steps:
      - name: Build failure message
        run: |
          echo "BUILD FAILED. Check the failed job above for the reason."
          echo "## Build Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the failed job in this run to see the cause." >> "$GITHUB_STEP_SUMMARY"
