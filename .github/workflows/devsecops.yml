name: GitHub Actions DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:

  # MAIN DEVSECOPS PIPELINE
  devsecops:
    name: DevSecOps Pipeline
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Verify Project Structure
      - name: Verify Project Files
        run: |
          echo "Checking project files..."
          ls -la

          if [ ! -f pom.xml ]; then
            echo "ERROR: pom.xml not found"
            exit 1
          fi

          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile not found"
            exit 1
          fi

          echo "Project files verified successfully"

      # 3. Gitleaks Secret Scanning
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 5. Maven Build
      - name: Maven Build
        run: |
          mvn --batch-mode clean verify

      # 6. SonarQube Code Analysis
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL secret is missing"
            exit 1
          fi

          if [[ ! "$SONAR_HOST_URL" =~ ^https?:// ]]; then
            echo "ERROR: Invalid SonarQube URL"
            exit 1
          fi

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN secret is missing"
            exit 1
          fi

          echo "Starting SonarQube analysis..."

          mvn --batch-mode \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar \
            -Dsonar.projectKey=github-actions-devsecops \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      # 7. Docker Image Build
      - name: Docker Build
        run: |
          docker build \
            -t devsecops-app:${{ github.sha }} .

      # 8. Trivy Container Vulnerability Scan
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

  # FINAL SUCCESS JOB
  build-successful:
    name: Build Successful
    runs-on: ubuntu-latest
    needs: devsecops
    if: ${{ needs.devsecops.result == 'success' }}

    steps:
      - name: Build Success Message
        run: |
          echo "======================================"
          echo "       DEVSECOPS BUILD SUCCESS"
          echo "======================================"
          echo "Checkout Code       : PASSED"
          echo "Project Verification: PASSED"
          echo "Gitleaks Scan       : PASSED"
          echo "Java Setup          : PASSED"
          echo "Maven Build         : PASSED"
          echo "SonarQube Analysis  : PASSED"
          echo "Quality Gate        : PASSED"
          echo "Docker Build        : PASSED"
          echo "Trivy Image Scan    : PASSED"
          echo "======================================"
          echo "ALL STAGES COMPLETED SUCCESSFULLY"
          echo "BUILD SUCCESS"
          echo "======================================"

      - name: Add Success Summary
        run: |
          {
            echo "## DEVSECOPS BUILD SUCCESS"
            echo ""
            echo "| Pipeline Stage | Status |"
            echo "|---|---|"
            echo "| Checkout | PASSED |"
            echo "| Project Verification | PASSED |"
            echo "| Gitleaks | PASSED |"
            echo "| Java Setup | PASSED |"
            echo "| Maven Build | PASSED |"
            echo "| SonarQube Analysis | PASSED |"
            echo "| Quality Gate | PASSED |"
            echo "| Docker Build | PASSED |"
            echo "| Trivy Scan | PASSED |"
            echo ""
            echo "**Repository:** ${{ github.repository }}"
            echo ""
            echo "**Branch:** ${{ github.ref_name }}"
            echo ""
            echo "**Commit:** ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # FINAL FAILURE JOB
  build-failed:
    name: Build Failed
    runs-on: ubuntu-latest
    needs: devsecops
    if: ${{ always() && needs.devsecops.result == 'failure' }}

    steps:
      - name: Build Failure Message
        run: |
          echo "======================================"
          echo "          DEVSECOPS BUILD FAILED"
          echo "======================================"
          echo "One or more pipeline stages failed."
          echo "Check the DevSecOps Pipeline logs."
          echo "======================================"

          {
            echo "## DEVSECOPS BUILD FAILED"
            echo ""
            echo "One or more pipeline stages failed."
            echo "Check the DevSecOps Pipeline job logs."
          } >> "$GITHUB_STEP_SUMMARY"
