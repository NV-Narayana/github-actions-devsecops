name: GitHub Actions DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:

  # 1. VERIFY PROJECT STRUCTURE
  verify-project:
    name: Verify Project Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Project Files
        run: |
          echo "Checking project files..."
          ls -la

          if [ ! -f pom.xml ]; then
            echo "ERROR: pom.xml not found"
            exit 1
          fi

          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile not found"
            exit 1
          fi

          echo "Project files verified successfully"


  # 2. GITLEAKS SECRET SCANNING
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    needs: verify-project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # 3. JAVA SETUP + MAVEN BUILD
  maven-build:
    name: Maven Build
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven Build
        run: |
          mvn --batch-mode clean verify

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: maven-target
          path: target/
          retention-days: 1


  # 4. SONARQUBE CODE ANALYSIS
  sonarqube-scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: maven-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: maven-target
          path: target/

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        run: |

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL secret is missing"
            exit 1
          fi

          if [[ ! "$SONAR_HOST_URL" =~ ^https?:// ]]; then
            echo "ERROR: Invalid SonarQube URL"
            exit 1
          fi

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN secret is missing"
            exit 1
          fi

          SONAR_HOST_URL="${SONAR_HOST_URL%/}"

          echo "Checking SonarQube connectivity..."

          curl -fsS --connect-timeout 15 --max-time 30 \
            "$SONAR_HOST_URL/api/system/status"

          echo ""
          echo "Starting SonarQube analysis..."

          mvn --batch-mode \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar \
            -Dsonar.projectKey=github-actions-devsecops \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true


  # 5. DOCKER IMAGE BUILD
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: sonarqube-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: maven-target
          path: target/

      - name: Docker Build
        run: |
          docker build \
            -t devsecops-app:${{ github.sha }} .

      - name: Save Docker Image
        run: |
          docker save devsecops-app:${{ github.sha }} -o devsecops-app.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: devsecops-app.tar
          retention-days: 1


  # 6. TRIVY CONTAINER VULNERABILITY SCAN
  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: devsecops-app.tar
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true


  # 7. FINAL SUCCESS JOB
  build-successful:
    name: Build Successful
    runs-on: ubuntu-latest

    needs:
      - verify-project
      - gitleaks-scan
      - maven-build
      - sonarqube-scan
      - docker-build
      - trivy-scan

    if: ${{ always() && needs.trivy-scan.result == 'success' && needs.sonarqube-scan.result == 'success' }}

    steps:
      - name: Build Success Message
        run: |
          echo "======================================"
          echo "       DEVSECOPS BUILD SUCCESS"
          echo "======================================"
          echo "Project Verification: PASSED"
          echo "Gitleaks Scan       : PASSED"
          echo "Maven Build         : PASSED"
          echo "SonarQube Analysis  : PASSED"
          echo "Quality Gate        : PASSED"
          echo "Docker Build        : PASSED"
          echo "Trivy Image Scan    : PASSED"
          echo "======================================"
          echo "ALL STAGES COMPLETED SUCCESSFULLY"
          echo "BUILD SUCCESS"
          echo "======================================"

      - name: Add Success Summary
        run: |
          {
            echo "## DEVSECOPS BUILD SUCCESS"
            echo ""
            echo "| Pipeline Stage | Status |"
            echo "|---|---|"
            echo "| Project Verification | PASSED |"
            echo "| Gitleaks | PASSED |"
            echo "| Maven Build | PASSED |"
            echo "| SonarQube Analysis | PASSED |"
            echo "| Quality Gate | PASSED |"
            echo "| Docker Build | PASSED |"
            echo "| Trivy Scan | PASSED |"
            echo ""
            echo "**Repository:** ${{ github.repository }}"
            echo ""
            echo "**Branch:** ${{ github.ref_name }}"
            echo ""
            echo "**Commit:** ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"


  # 8. FINAL FAILURE JOB
  build-failed:
    name: Build Failed
    runs-on: ubuntu-latest

    needs:
      - verify-project
      - gitleaks-scan
      - maven-build
      - sonarqube-scan
      - docker-build
      - trivy-scan

    if: ${{ always() && contains(needs.*.result, 'failure') }}

    steps:
      - name: Build Failure Message
        run: |
          echo "======================================"
          echo "          DEVSECOPS BUILD FAILED"
          echo "======================================"

          echo "Verify   : ${{ needs.verify-project.result }}"
          echo "Gitleaks : ${{ needs.gitleaks-scan.result }}"
          echo "Maven    : ${{ needs.maven-build.result }}"
          echo "Sonar    : ${{ needs.sonarqube-scan.result }}"
          echo "Docker   : ${{ needs.docker-build.result }}"
          echo "Trivy    : ${{ needs.trivy-scan.result }}"

          echo "======================================"

          {
            echo "## DEVSECOPS BUILD FAILED"
            echo ""
            echo "| Pipeline Stage | Result |"
            echo "|---|---|"
            echo "| Project Verification | ${{ needs.verify-project.result }} |"
            echo "| Gitleaks | ${{ needs.gitleaks-scan.result }} |"
            echo "| Maven Build | ${{ needs.maven-build.result }} |"
            echo "| SonarQube | ${{ needs.sonarqube-scan.result }} |"
            echo "| Docker Build | ${{ needs.docker-build.result }} |"
            echo "| Trivy Scan | ${{ needs.trivy-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
