name: GitHub Actions DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  devsecops:
    name: DevSecOps Pipeline
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Verify Project Structure
      - name: Verify Maven Project
        run: |
          echo "Checking project files..."
          ls -la

          if [ ! -f pom.xml ]; then
            echo "ERROR: pom.xml not found in repository root"
            exit 1
          fi

          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile not found"
            exit 1
          fi

          echo "Project files verified successfully"

      # 3. Gitleaks Secret Scan
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      # 5. Maven Build
      - name: Maven Build
        run: mvn clean package

      # 6. SonarQube Analysis
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=github-actions-devsecops \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      # 7. Docker Image Build
      - name: Docker Build
        run: |
          docker build -t devsecops-app:${{ github.sha }} .

      # 8. Trivy Container Scan
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
